name: Deploy TEXT.AI by environment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        type: choice
        options:
          - develo3zpment
          - sta3zging
          - produc3ztion
        default: develo3zpment

permissions:
  contents: read

concurrency:
  group: text-ai-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  validate-and-build:
    name: Validate and build (${{ inputs.environment }})
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm check

      - name: Run tests
        run: pnpm vitest run

      - name: Build production artifacts
        run: pnpm build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: text-ai-${{ inputs.environment }}-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
